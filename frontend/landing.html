<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ortega Service Cleaning · Apps</title>
<meta name="osc-version" content="{{version}}">
<meta name="theme-color" content="#234B50">
<link rel="icon" href="limpiadoras/iconos/favicon-64.png">
<link rel="apple-touch-icon" href="limpiadoras/iconos/limpiadora-180.png">
<link rel="stylesheet" href="limpiadoras/app.css">
</head>
<body style="overflow:auto">
<main class="inicio">
  <div class="marca"><img src="limpiadoras/iconos/logo-navy.png" alt="Ortega Service Cleaning"></div>
  <h1>Instala tu app</h1>
  <p>Elige tu portal y agrégalo a la pantalla de inicio.</p>
  <div class="opciones">
{{tarjetas}}
  </div>
  <div class="instalar">
    <b>iPhone:</b> abre tu app en Safari → botón Compartir → «Agregar a pantalla de inicio».<br>
    <b>Android:</b> abre tu app en Chrome → menú ⋮ → «Instalar app» o «Agregar a pantalla principal».<br>
    <span style="opacity:.6;font-size:12px">{{version}}</span>
  </div>
</main>
</body>
</html>
